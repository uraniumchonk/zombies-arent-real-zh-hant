# A built-in mutator (src/mutators.odin): a BUILT-IN row on the MUTATORS screen, and one the
# daily challenge may roll (src/daily.odin). The game's
# own file, so any config.ini setting may go here; each value is an absolute, like config.ini's.

[mutator]
name = 牆內作戰
description = 駐軍、狙擊手、迫擊砲與砲塔只能部署在安全區內的建築。每階段額外獲得 10% 金錢。

[safe_zone]
building_units_inside_only = true

[economy]
money_bonus_percent = 10.0
